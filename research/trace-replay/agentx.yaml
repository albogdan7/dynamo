traffic:
  source:
    type: trace
    paths: [research/trace-replay/data/agentx.jsonl]
    format: weka
    block_size: 64
    nested_timestamp_basis: auto
  load:
    type: trace_timestamps
    agentic_lanes: 1
engine:
  model: Qwen/Qwen2.5-7B-Instruct-1M
  hardware: h200_sxm
  backend: vllm
  workers:
    aggregated:
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 256
      kv_cache:
        block_size: 512
        capacity:
          type: fixed
          blocks: 3584
      timing:
        type: polynomial
